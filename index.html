function getKSTDate(offsetDays) {
  const now = new Date();
  const kst = new Date(now.getTime() + 9 * 60 * 60 * 1000);
  kst.setUTCDate(kst.getUTCDate() + (offsetDays || 0));
  return kst.toISOString().slice(0, 10);
}

  { lv: 1, name: "알", emoji: "🥚", min: 0 },

];

function getLevel(totalReps) {
  let cur = LEVELS[0];
  for (const l of LEVELS) {
    if (totalReps >= l.min) cur = l;
  }
  const next = LEVELS.find(l => l.min > totalReps);
  const prevMin = cur.min;
  const nextMin = next ? next.min : cur.min;
  const progress = next ? ((totalReps - prevMin) / (nextMin - prevMin)) * 100 : 100;
  return { ...cur, next, progress: Math.min(100, progress), toNext: next ? next.min - totalReps : 0 };
}

function getTodayQuote() {
  const d = new Date(TODAY);
  const dayNum = Math.floor(d.getTime() / 86400000);
  return QUOTES[dayNum % QUOTES.length];
}

// 마일스톤 (다음 목표 문장 수)
function getMilestone(doneCount) {
  const stops = [25, 50, 100, 150, 200, 300, 400, 500, 750, 1000];
  const next = stops.find(s => s > doneCount) || (Math.ceil(doneCount / 500) * 500 + 500);
  const prev = stops.filter(s => s <= doneCount).pop() || 0;
  const progress = ((doneCount - prev) / (next - prev)) * 100;
  return { next, remaining: next - doneCount, progress: Math.min(100, Math.max(0, progress)) };
}

// 이번 주 월~일 날짜 배열 (한국 시간 기준)
function getThisWeek() {
  const today = new Date(TODAY);
  const dow = today.getUTCDay(); // 0=일, 1=월...
  const mondayOffset = dow === 0 ? -6 : 1 - dow;
  const days = [];
  const labels = ["월", "화", "수", "목", "금", "토", "일"];
  for (let i = 0; i < 7; i++) {
    const d = new Date(today);
    d.setUTCDate(d.getUTCDate() + mondayOffset + i);
    days.push({ date: d.toISOString().slice(0, 10), label: labels[i] });
  }
  return days;
}

const RAW = [
  {t:"내 영어 (스피킹 연습)",ty:"단문",e:"Speaking of which — it's been a while since you went traveling, right?",k:"그래서 말인데 — 여행 간 지 꽤 됐죠? (앞 주제 자연스럽게 이어받을 때)"},
  {t:"내 영어 (스피킹 연습)",ty:"단문",e:"I've had loads of relationships with Korean guys, but now I'm fed up with dating them. Most Korean guys are mama's boys and really dependent on their moms.",k:"한국 남자들이랑 연애 많이 했는데 이제 지쳤어. 대부분 마마보이에 의존적이야."},
  {t:"내 영어 (스피킹 연습)",ty:"단문",e:"I actually got that sentence from Love is Blind UK because it's so me. I can be selfish and outgoing, and sometimes I act a bit childish. So I'm always looking for someone who's caring, loyal, and humble — funny isn't really a priority for me.",k:"러브이즈블라인드 UK에서 따온 문장인데 완전 나야. 이기적이고 외향적이고 가끔 유치하게 굴어서, 다정하고 믿음직하고 겸손한 사람을 찾아."},
  {t:"내 영어 (스피킹 연습)",ty:"단문",e:"When I travel, it happens all the time. People think I'm a planning person because I'm ENTJ, but honestly, no. I pin fancy restaurants and bars on Google Maps, but I always end up coming across some random place — it's just like life, you know?",k:"여행할 때 항상 그래. 계획형인 줄 아는데 아니야. 맛집 저장해두는데 결국 아무 데나 들어가 — 인생이 그런 거잖아."},
  {t:"내 영어 (스피킹 연습)",ty:"단문",e:"All my exes were a little forward. I'm not really forward myself — I don't know how else to put it. I just need someone to come to me first.",k:"전 남자친구들이 다 적극적이었어. 난 그렇지 않거든 — 뭐라 표현해야 할지. 누군가 먼저 다가와줘야 해."},
  {t:"내 영어 (스피킹 연습)",ty:"단문",e:"Besides, delivery food is too salty and expensive.",k:"게다가 배달 음식은 너무 짜고 비싸."},
  {t:"내 영어 (스피킹 연습)",ty:"단문",e:"I have a pretty deep relationship with her.",k:"나는 그녀와 꽤 깊은 관계야."},
  {t:"내 영어 (스피킹 연습)",ty:"단문",e:"I usually stay in, but sometimes I go out for drinks.",k:"보통은 집에 있는데, 가끔 술 마시러 나가."},
  {t:"내 영어 (스피킹 연습)",ty:"단문",e:"I'm pretty outgoing, but I don't really need a big friend group.",k:"나 꽤 외향적인데, 사실 친구가 많이 필요하진 않아."},
  {t:"내 영어 (스피킹 연습)",ty:"단문",e:"If I ever want new friends, I can make them whenever.",k:"새 친구가 필요하면 언제든 만들 수 있어."},
  {t:"내 영어 (스피킹 연습)",ty:"단문",e:"I work from home so I cook every day for myself.",k:"재택근무라서 매일 직접 밥을 해먹어."},
  {t:"내 영어 (스피킹 연습)",ty:"단문",e:"You did everything you could.",k:"네가 할 수 있는 건 다 했어. (위로할 때)"},
  {t:"내 영어 (스피킹 연습)",ty:"단문",e:"Drinking messes me up, but I didn't know how to deal with my stress.",k:"술 마시면 엉망이 되는데, 스트레스를 어떻게 풀어야 할지 몰랐어."},
  {t:"내 영어 (스피킹 연습)",ty:"단문",e:"I take a long bath with classical music, and it makes me relax.",k:"클래식 음악 틀고 오래 목욕하면, 그게 날 편안하게 해줘."},
  {t:"내 영어 (스피킹 연습)",ty:"단문",e:"I gave up on going to Australia because I didn't have enough money.",k:"돈이 부족해서 호주 가는 거 포기했어."},
  {t:"내 영어 (스피킹 연습)",ty:"단문",e:"It makes me anxious and depressed.",k:"그게 날 불안하고 우울하게 만들어."},
  {t:"내 영어 (스피킹 연습)",ty:"단문",e:"If things don't go as planned, I'll figure it out.",k:"일이 계획대로 안 되면, 어떻게든 해결할 거야."},
  {t:"Morning Routine",ty:"통대화",e:"Here's what my typical morning looks like.\n\nI'm not really a morning person.\n\nBut I try to wake up around 8 AM.\n\nI check my phone first thing in the morning.\n\nAnd then I brush my teeth right away\n\nbecause I can't stand my bad breath.\n\nAfter that, I take a cold shower.\n\nI don't like cold showers,\n\nbut it helps me to wake up quickly.\n\nNormally, I don't eat breakfast,\n\nbut now that I live alone,\n\nI have to take better care of myself.\n\nSo I'm trying to eat smaller portions of food.",k:"아침 루틴 설명"},
  {t:"Workout",ty:"통대화",e:"I've been working out in the morning lately.\n\nI've never been a morning workout person.\n\nBut I decided to give it a shot for the first time.\n\nI used to work out because I cared about my image.\n\nYou know, Instagram and stuff.\n\nBut these days, I work out for myself.\n\nAnd it's true that I gained some weight over the past few months.\n\nI wasn't eating right and didn't have any motivation to go to the gym.\n\nSo my weight was slowly creeping up to where I am now.\n\nI wanna get back to my normal weight, so wish me luck.",k:"운동 이야기"},
  {t:"Coffee",ty:"통대화",e:"I used to start my day with a cup of coffee.\n\nI couldn't really function without it.\n\nIt was kind of hard for me to get through the day.\n\nBut I heard drinking coffee right after waking up messes with some kind of hormone.\n\nAnd that's what makes me feel jittery.\n\nBut I would just ignore it.\n\nI don't think I can possibly give up caffeine just yet.\n\nI'm not really ready for that.\n\nBut now I drink coffee a bit later in the day.\n\nAnd I'm planning to get a coffee machine, so that I don't have to buy coffee every day.",k:"커피 이야기"},
  {t:"What do you do for fun?",ty:"통대화",e:"When I'm asked what I like to do in my free time,\n\nI sometimes don't know what to say.\n\nThat's because there are so many things I enjoy doing.\n\nFor one thing, I really like hanging out with my friends.\n\nUsually after school, we grab some beers and sometimes we have a movie night.\n\nI also love playing sports,\n\nso every Wednesday I play badminton at a park near my place.\n\nOh, and one of my friends got me into baking recently,\n\nso we bake together once or twice a month.\n\nBut I also like doing something productive in my free time.\n\nThat's why lately, I've been learning English with Jenni every night.",k:"취미 소개"},
  {t:"My career",ty:"통대화",e:"It's been three months since I started working at Google\n\nI work as a full-stack engineer.\n\nThis is my first job since graduating from uni\n\nI have a typical nine-to-six work schedule\n\nAnd I have to go to the office three times a week\n\nI remember that my professor wanted me to attend graduate school\n\nBut I was more interested in building my career and making money\n\nPlus, I wanted to work in a corporate environment and see what it's like\n\nSo having this full time job is exactly what I wanted\n\nIt can be challenging sometimes but so far I enjoy working here at Google",k:"직장 이야기"},
  {t:"Being asked a number & going out on a date",ty:"통대화",e:'The other day, I was working on my essay at a Starbucks near my place\n\nAnd there was this guy who like accidentally dropped his wallet near me\n\nHe came over to pick it up and we started talking\n\nIt turned out that we go to the same college and we are in the same grade\n\nHe then asked like if I was seeing anyone\n\nI said no then he was like "Can I get your number then?"\n\nWell he seemed like a nice guy and he looked cute\n\nSo I let him have my number\n\nAnd yesterday he texted me and sort of asked me out on a date\n\nSo this weekend we gonna have dinner together',k:"번호 받고 데이트"},
  {t:"One of those days",ty:"통대화",e:'I had a terrible morning today.\n\nI headed out as usual\n\nBut the bus I usually take, just passed right by me.\n\nI was like, "What am I supposed to do?"\n\nSo, I checked an alternative route to get to work\n\nThe map said the subway was coming in 5 minutes\n\nSo I rushed to the station\n\nBut when I got there, I couldn\'t get on the train\n\nApparently, there was a protest\n\nSo the train was delayed\n\nI ended up taking a cab, which cost me a lot\n\nBecause of the rush hour traffic\n\nWhen these things happen, I seriously consider quitting my job',k:"최악의 아침"},
  {t:"Dog person",ty:"통대화",e:"I'm totally a dog person\n\nI mean, don't get me wrong\n\nCats are cute too\n\nBut there's just something special about dogs\n\nWhen I come home from work, My dog is just so happy to see me\n\nHe is wagging his tail and jumping up and down\n\nAnd when I pet him after a long day, my stress is just gone\n\nWhen I asked him for a walk, he hops around the house out of happiness\n\nAnd that makes me much happier\n\nI mean, I have to walk him everyday, so he can be needy sometimes\n\nBut it is just so worth it, because he's super adorable",k:"강아지 얘기"},
  {t:"We don't see each other very often",ty:"통대화",e:"I have friends but we don't get to see each other very often\n\nFirst of all, we all have job so we're always tied up at work\n\nPlus, most of us are married now and many of us have kids\n\nSome are working overseas and a few have even moved to other countries\n\nSo, you know, it's getting harder to keep in touch as time goes by",k:"친구들 근황"},
  {t:"Getting wasted",ty:"통대화",e:"You know what? I got so drunk last night.\n\nIt was one of my friend's birthday, so me and my friends basically drank a lot.\n\nBut the thing is, I can't usually drink more than half a bottle of soju.\n\nI don't know why, but last night, I knocked back 10 glasses of soju in a row.\n\nAnd guess what? I got hammered.\n\nBad idea.\n\nBut luckily, my friend is such a mom.\n\nShe took care of everything.\n\nAnd she got me home safe.\n\nAnd I'm still trying to get over this massive hangover.",k:"술 마신 이야기"},
  {t:"Getting a cold",ty:"통대화",e:"I haven't been feeling well since last night.\n\nI woke up this morning with a runny nose and a sore throat, I think I've caught a cold.\n\nI've been sneezing all day and I've got a bit of a fever too, so it's definitely more than just a sniffle.\n\nI've taken some medicine but nothing seems to be helping yet.\n\nIt's so annoying because I've got loads of work to do, but I just feel like I can't even get out of bed.\n\nHopefully I'll feel better soon.",k:"감기 걸린 이야기"},
  {t:"Sharing a table with strangers",ty:"통대화",e:'We went inside and I noticed right away that the place was packed\n\nAll the tables were occupied and it didn\'t look like anyone was leaving anytime soon\n\nSo, I turned to my friend and just as I was about to suggest trying a different place,\n\nHe went over to this old couple at a table\n\nand asked them if we could share the table with them\n\nAnd I was like "What the hell are you doing? Are you crazy?"\n\nThat\'s rude, right?\n\nI mean, I found that really inappropriate.\n\nBut, to my surprise, the couple were very cool with it,\n\nSo we sat right next to them\n\nI mean, I still found that kind of awkward,\n\nBut it turns out my friend does that all the time',k:"모르는 사람이랑 합석"},

async function sbGet() {
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/flashcards?user_id=eq.${USER_ID}&select=data`, {
      headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` }
    });
    const rows = await res.json();
    if (rows && rows.length > 0) return rows[0].data;
    return null;
  } catch(e) { return null; }
}

async function sbSave(data) {
  try {
    // 기존 row가 있으면 PATCH(업데이트), 없으면 POST(생성)
    const checkRes = await fetch(`${SUPABASE_URL}/rest/v1/flashcards?user_id=eq.${USER_ID}&select=user_id`, {
      headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` }
    });
    const rows = await checkRes.json();
    const exists = rows && rows.length > 0;

    if (exists) {
      // 업데이트 (데이터 안 날아감)
      const res = await fetch(`${SUPABASE_URL}/rest/v1/flashcards?user_id=eq.${USER_ID}`, {
        method: "PATCH",
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": `Bearer ${SUPABASE_KEY}`,
          "Content-Type": "application/json",
          "Prefer": "return=minimal"
        },
        body: JSON.stringify({ data, updated_at: new Date().toISOString() })
      });
      return res.ok;
    } else {
      // 새로 생성
      const res = await fetch(`${SUPABASE_URL}/rest/v1/flashcards`, {
        method: "POST",
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": `Bearer ${SUPABASE_KEY}`,
          "Content-Type": "application/json",
          "Prefer": "return=minimal"
        },
        body: JSON.stringify({ user_id: USER_ID, data, updated_at: new Date().toISOString() })
      });
      return res.ok;
    }
  } catch(e) {
    return false;
  }
}

function shuffle(a) {
  const b = [...a];
  for (let i = b.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [b[i], b[j]] = [b[j], b[i]];
  }
  return b;
}

      const isDone = qi >= queue.length;
      if (isDone) return;
      // 입력창에 포커스 있으면 무시
      if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;

      if (!revealed) {
        if (e.code === "Space" || e.key === " " || e.key === "Enter") {
          e.preventDefault();
          setRevealed(true);
        }
      } else {
        if (e.key === "1") { e.preventDefault(); handleAnswer("again"); }
        else if (e.key === "2") { e.preventDefault(); handleAnswer("ok"); }
        else if (e.key === "3") { e.preventDefault(); handleAnswer("easy"); }
        else if (e.code === "Space" || e.key === " ") { e.preventDefault(); }
      }
    }
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [tab, started, revealed, qi, queue, cards, streak, perDay]);

  function buildQueue(c, pd = perDay) {
    const todayDone = c.filter(x => x.lastReviewed === TODAY);
    const todayDoneIds = new Set(todayDone.map(x => x.id));
    // 복습 카드: 예정된 거 전부 (가장 오래 밀린 것부터) - 제한 없음
    const due = c.filter(x => x.inn && x.nr && x.nr <= TODAY && !todayDoneIds.has(x.id))
      .sort((a, b) => {
        if (a.nr !== b.nr) return a.nr < b.nr ? -1 : 1;
        return Math.random() - 0.5;
      });
    // 오늘 처음 학습한 새 카드 수 (오늘 리뷰했고 rp가 1 = 오늘 처음 본 것)
    const newDoneToday = todayDone.filter(x => (x.rp || 0) === 1).length;
    // 새 카드: 설정한 개수만큼 (복습과 별개)
    const newCards = shuffle(c.filter(x => !x.inn));
    const newQuota = Math.max(0, pd - newDoneToday);
    const newToShow = newCards.slice(0, newQuota);
    // 복습(전부) + 새 카드(할당량) — 복습 먼저(오래된 순), 새 카드 섞어서 뒤에
    const q = [...due, ...newToShow];
    setQueue(q);
    setOriginalCount(q.length);
    const perfectIds = todayDone.filter(x => {
      const nd = new Date(x.nr || TODAY);
      return Math.round((nd - new Date(TODAY)) / 86400000) > 2;
    }).map(x => x.id);
    setSeenIds(perfectIds);
    setQi(0);
    setResults([]);
  }

  async function handleAnswer(rating) {
    const c = queue[qi];
    let ef = c.ef || 2.5;
    let rp = c.rp || 0;
    let iv = c.iv || 1;

    if (rating === "again") {
      // 다시 볼게: 반복 리셋, ef 감소, 오늘 세션에서 다시
      ef = Math.max(1.3, ef - 0.2);
      const remaining = queue.length - qi - 1;
      const minGap = Math.min(3, remaining);
      const insertAt = qi + 1 + minGap + Math.floor(Math.random() * Math.max(1, remaining - minGap + 1));
      const newQ = [...queue];
      newQ.splice(insertAt, 0, { ...c, ef, rp: 0, iv: 1 });
      setQueue(newQ);
      const updated = cards.map(x => x.id === c.id ? { ...x, ef, rp: 0, iv: 1, inn: true, lastReviewed: TODAY, todayRating: "again" } : x);
      await saveAll(updated, { c: streak, l: TODAY }, perDay);
      setNextMsg("잠시 후 다시 나올 거야 💪");
      setTimeout(() => { setQi(qi + 1); setRevealed(false); setNextMsg(""); }, 800);
      return;
    }

    // SM-2 quality: ok=3, easy=5
    const q = rating === "easy" ? 5 : 3;
    // ef 업데이트 (SM-2 공식)
    ef = ef + (0.1 - (5 - q) * (0.08 + (5 - q) * 0.02));
    ef = Math.max(1.3, ef);

    // 반복 횟수에 따른 간격 (핵심!)
    rp = rp + 1;
    let ni;
    if (rp === 1) {
      ni = rating === "easy" ? 4 : 1;
    } else if (rp === 2) {
      ni = rating === "easy" ? 7 : 4;
    } else {
      // 3번째부터는 이전 간격 × ef → 점점 길어짐
      ni = Math.round(iv * ef);
    }

    // 지연 복습 보너스: 예정일보다 늦게 봤는데 기억했으면 간격 더 늘림
    if (c.nr && rp >= 2) {
      const due = new Date(c.nr);
      const now = new Date(TODAY);
      const overdueDays = Math.round((now - due) / 86400000);
      if (overdueDays > 0) {
        // 늦은 만큼 절반을 보너스로 추가 (기억이 더 굳었다는 증거)
        ni = ni + Math.round(overdueDays * 0.5);
      }
    }

    ni = Math.max(1, Math.min(ni, 180)); // 최대 6개월

    const nd = new Date(TODAY); nd.setDate(nd.getDate() + ni);
    const nextDate = nd.toISOString().slice(0, 10);
    const updated = cards.map(x => x.id === c.id
      ? { ...x, iv: ni, ef, nr: nextDate, rp, inn: true, lastReviewed: TODAY, todayRating: rating }
      : x);
    await saveAll(updated, { c: streak, l: TODAY }, perDay);
    setResults(prev => [...prev, { e: c.e, k: c.k, t: c.t, rating }]);
    setNextMsg(`다음 복습: ${ni}일 후 (${rp}회째)`);
    setSeenIds(prev => prev.includes(c.id) ? prev : [...prev, c.id]);
    // 이 카드가 큐 뒤쪽에 또 있으면(다시 볼게로 재삽입) 제거
    setQueue(prevQ => {
      const cleaned = prevQ.filter((card, idx) => idx <= qi || card.id !== c.id);
      return cleaned;
    });
    setTimeout(() => { setQi(qi + 1); setRevealed(false); setNextMsg(""); }, 800);
  }

            ) : (
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
                <button onClick={() => setConfirmReset(false)} style={{ padding: 11, background: "#ffffff", border: "1px solid #d2d2d7", borderRadius: 10, fontSize: 14, cursor: "pointer", color: "#6e6e73" }}>취소</button>
                <button onClick={resetData} style={{ padding: 11, background: "#ff3b30", border: "none", borderRadius: 10, fontSize: 14, cursor: "pointer", color: "#fff", fontWeight: 600 }}>정말 초기화</button>
              </div>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

    const domNode = document.getElementById('root');
    const root = ReactDOM.createRoot(domNode);
    root.render(React.createElement(App));
  </script>
</body>
</html>
